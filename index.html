<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metodologías de Diseño</title><style>html,body,#site{width:100%;height:100%;margin:0;border:0;background:#080909}#msg{position:fixed;inset:0;display:grid;place-items:center;color:#f0ede5;font-family:system-ui,sans-serif;background:#080909}p{color:#a9aaa4}</style></head><body><div id="msg"><div><h1>Metodologías de Diseño</h1><p>Cargando recurso interactivo…</p></div></div><iframe id="site" title="Metodologías de Diseño" hidden></iframe><script src="data-core.js"></script><script>(async function(){try{var t=(await fetch('README.md',{cache:'no-store'}).then(function(r){return r.text()})).trim();var s=atob((window.__SITE_A||'')+t);var a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);var ds=new DecompressionStream('gzip');var txt=await new Response(new Blob([a]).stream().pipeThrough(ds)).text();var f=document.getElementById('site');f.srcdoc=txt;f.hidden=false;document.getElementById('msg').hidden=true}catch(e){document.querySelector('#msg p').textContent='No fue posible cargar el recurso. Recargue la página.';console.error(e)}})();</script></body></html>
